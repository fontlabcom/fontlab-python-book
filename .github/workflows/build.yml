# this_file: .github/workflows/build.yml
name: Book build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.7'
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests_build -v
      - run: uv run fontlab-python-book
      - name: Require committed output parity
        run: |
          git diff --exit-code HEAD -- docs
          test -z "$(git ls-files --others -- docs)"
