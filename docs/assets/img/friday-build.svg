<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="760" height="250" fill="#f6f3ec" rx="8"/><text x="20" y="30" font-size="13" fill="#666">First run: today's folder holds no font files</text><rect x="20" y="42" width="120" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="80.0" y="70.0" text-anchor="middle" font-size="15" fill="#222">Checks</text><line x1="140" y1="65" x2="178" y2="65" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="180" y="42" width="150" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="255.0" y="70.0" text-anchor="middle" font-size="15" fill="#222">Make the folder</text><line x1="330" y1="65" x2="368" y2="65" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="370" y="42" width="170" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5" stroke-dasharray="6 4"/><text x="455" y="70" text-anchor="middle" font-size="15" fill="#222">You export</text><text x="20" y="140" font-size="13" fill="#666">Second run: the files are there</text><rect x="20" y="152" width="104" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="72.0" y="180.0" text-anchor="middle" font-size="15" fill="#222">Files</text><line x1="124" y1="175" x2="141" y2="175" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="142" y="152" width="104" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="194.0" y="180.0" text-anchor="middle" font-size="15" fill="#222">Inspect</text><line x1="246" y1="175" x2="263" y2="175" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="264" y="152" width="104" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="316.0" y="180.0" text-anchor="middle" font-size="15" fill="#222">Glyph proof</text><line x1="368" y1="175" x2="385" y2="175" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="386" y="152" width="104" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="438.0" y="180.0" text-anchor="middle" font-size="15" fill="#222">Text proof</text><line x1="490" y1="175" x2="507" y2="175" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="508" y="152" width="104" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="560.0" y="180.0" text-anchor="middle" font-size="15" fill="#222">Source copy</text><line x1="612" y1="175" x2="629" y2="175" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><rect x="630" y="152" width="104" height="46" rx="6" fill="#fff" stroke="#444" stroke-width="1.5"/><text x="682.0" y="180.0" text-anchor="middle" font-size="15" fill="#222">Next version</text><text x="20" y="228" font-size="13" fill="#666">A step that reports a problem stops the run, and the steps after it wait.</text></svg>