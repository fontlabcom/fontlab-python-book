# this_file: src_docs/mkdocs.yml
site_name: Scripting FontLab
site_description: Learn to script FontLab 9 with Python, one studio chore at a time.
docs_dir: md
site_dir: ../docs
use_directory_urls: true
validation:
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn
theme:
  name: materialx
  custom_dir: overrides
  language: en
  font: false
  palette:
    - scheme: default
      primary: black
      accent: red
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - https://i.fontlab.com/fltheme26/1.0.0/components.css
  - https://i.fontlab.com/fltheme26/1.0.0/theme.css
  - assets/book.css
extra_javascript:
  - https://i.fontlab.com/fltheme26/1.0.0/basecoat.js
  - https://i.fontlab.com/fltheme26/1.0.0/theme.js
  - assets/book.js
exclude_docs: |
  assets/PROVENANCE.md

