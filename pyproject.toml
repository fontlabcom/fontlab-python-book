# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "fontlab-python-book"
dynamic = ["version"]
description = "Build the FontLab Python book documentation"
requires-python = ">=3.13"
dependencies = [
    "fire==0.7.1",
    "properdocs==1.6.7",
    "mkdocs==1.6.1",
    "mkdocs-materialx==10.1.8",
    "pymdown-extensions==11.0.1",
]

[project.scripts]
fontlab-python-book = "fontlab_python_book:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/fontlab_python_book"]

